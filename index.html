<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Hangout OS</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e07a5f"><link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<div id="login"><h1>HANGOUT OS</h1><div>Who's logging in? Swipe, then tap the front bubble.</div>
<div id="rw"><div id="ring"></div></div>
<div class="row" style="z-index:1"><button class="btn" id="lp">‹</button><button class="btn" id="rp">›</button></div>
<form id="pwf" hidden><b id="who"></b><input id="pw" type="password" placeholder="password" autocomplete="current-password"><button class="btn p">Enter</button><div id="err"></div></form>
<div class="hint">Password = your name in lowercase (change it in Profile).</div><div class="demo">DEMO MODE · data lives on this device only</div></div>
<div id="desk" hidden><div id="pills"></div><div id="icons"></div><div id="wins"></div>
<div id="bar"><div class="av" id="me"></div><b id="mn"></b><span class="sp"></span><button class="btn" id="pv">‹</button><span id="pg"></span><button class="btn" id="nx">›</button><span class="sp"></span><span class="demo" style="position:static">DEMO</span><span id="clk"></span><button class="btn" id="lo">Log out</button></div></div>
<div id="vw"></div>
<script src="seed.js"></script><script src="app.js"></script></body></html>
